services:
  backend:
    build:
      context: ./backend
    image: docqa-backend:latest
    env_file:
      - ./backend/.env          # LLM_PROVIDER, LLM_MODEL, GROQ_API_KEY, ...
    environment:
      DATA_DIR: /app/data
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    volumes:
      - docqa-data:/app/data    # FAISS indexes survive restarts and rebuilds
    ports:
      - "127.0.0.1:8000:8000"   # for curl / `npm run dev`; not exposed to the network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s        # loading the embedding model takes a while

  frontend:
    build:
      context: ./frontend
    image: docqa-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  docqa-data:
